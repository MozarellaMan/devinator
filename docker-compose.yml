services:
  devinbridge:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Flip to "true" to run fully offline with the stateful fake Devin — no
      # DEVIN_* or GITHUB_* values are required in that mode.
      MOCK_DEVIN: "${MOCK_DEVIN:-false}"

      # Devin API (used when MOCK_DEVIN is false).
      DEVIN_API_URL: "${DEVIN_API_URL:-https://api.devin.ai}"
      DEVIN_API_KEY: "${DEVIN_API_KEY:-}"

      # GitHub API — TARGET_REPO is "owner/name"; required unless MOCK_DEVIN=true.
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      TARGET_REPO: "${TARGET_REPO:-}"

      # Optional: when set, /webhook/github requires a valid X-Hub-Signature-256.
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"

      # Tuning.
      DEVIN_TIMEOUT_MINUTES: "${DEVIN_TIMEOUT_MINUTES:-30}"
      PORT: "8080"
